# Optional overlay for the Julgate-only secrets.
# Usage:
# docker compose -f docker-compose-simple.yaml -f docker-compose-secrets.yaml up -d
# JULGATE_GUACAMOLE_JSON_SECRET_KEY is still required as an environment value
# because the upstream Guacamole image does not support Docker *_FILE variables.

services:
  julgate:
    environment:
      JULGATE_ADMIN_PASSWORD: ""
      JULGATE_ADMIN_PASSWORD_FILE: /run/secrets/julgate_admin_password
      JULGATE_CREDENTIAL_KEY: ""
      JULGATE_CREDENTIAL_KEY_FILE: /run/secrets/julgate_credential_key
    secrets:
      - julgate_admin_password
      - julgate_credential_key

secrets:
  julgate_admin_password:
    file: ${JULGATE_ADMIN_PASSWORD_SECRET_FILE:-./secrets/julgate_admin_password}
  julgate_credential_key:
    file: ${JULGATE_CREDENTIAL_KEY_SECRET_FILE:-./secrets/julgate_credential_key}
