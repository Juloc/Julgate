name: Apply account password port

on:
  push:
    branches:
      - agent/port-matgate-account-password
    paths:
      - patches/apply-account-password-port.py

permissions:
  contents: write

jobs:
  apply-port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply selective port
        run: python3 patches/apply-account-password-port.py

      - name: Commit isolated port
        run: |
          rm -f patches/apply-account-password-port.py
          rm -f .github/workflows/apply-account-password-port.yml
          rmdir patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port secure account password change"
          git push origin HEAD

      - name: Validate solution
        run: dotnet test Matgate.slnx --configuration Release
