name: Apply GitHub package versioning

on:
  push:
    branches:
      - agent/version-github-packages
    paths:
      - patches/apply-package-versioning.py

permissions:
  contents: write

jobs:
  apply-versioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Apply package versioning
        run: python3 patches/apply-package-versioning.py

      - name: Validate solution
        run: dotnet test Matgate.slnx --configuration Release

      - name: Commit validated versioning
        run: |
          rm -f patches/apply-package-versioning.py
          rm -f .github/workflows/apply-package-versioning.yml
          rmdir patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version GitHub container packages by release channel"
          git push origin HEAD
