name: Apply Android RDP keyboard fix

on:
  push:
    branches:
      - agent/fix-android-rdp-keyboard
    paths:
      - patches/apply-android-rdp-keyboard-fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply source change
        run: python3 patches/apply-android-rdp-keyboard-fix.py

      - name: Validate solution
        run: dotnet test Matgate.slnx --configuration Release

      - name: Commit validated change
        run: |
          rm -f patches/apply-android-rdp-keyboard-fix.py
          rm -f .github/workflows/apply-android-rdp-keyboard-fix.yml
          rmdir patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Android RDP keyboard input"
          git push origin HEAD
