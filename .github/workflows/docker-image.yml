name: Julgate build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: julgate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Julgate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose files
        env:
          JULGATE_GUACAMOLE_JSON_SECRET_KEY: fedcba98765432100123456789abcdef
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf '%s' 'ci-only-password-with-16-characters' > secrets/julgate_admin_password
          printf '%s' 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' > secrets/julgate_credential_key
          printf '%s' 'QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo1MjM0NTY=' > secrets/julgate_credential_key_previous

          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose-simple.yaml config >/dev/null
          docker compose -f docker-compose-dockhand.yaml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose-secrets.yaml config >/dev/null
          docker compose -f docker-compose-simple.yaml -f docker-compose-secrets.yaml config >/dev/null
          docker compose -f docker-compose-dockhand.yaml -f docker-compose-secrets.yaml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose-secrets.yaml -f docker-compose-key-rotation.yaml config >/dev/null
          docker compose -f docker-compose-simple.yaml -f docker-compose-secrets.yaml -f docker-compose-key-rotation.yaml config >/dev/null
          docker compose -f docker-compose-dockhand.yaml -f docker-compose-secrets.yaml -f docker-compose-key-rotation.yaml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose-secrets.yaml -f docker-compose-migration-test.yml config >/dev/null

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Matgate.slnx

      - name: Build
        run: dotnet build Matgate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Matgate.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Start hardened secret stack and smoke test
        env:
          JULGATE_GUACAMOLE_JSON_SECRET_KEY: fedcba98765432100123456789abcdef
          JULGATE_BIND_ADDRESS: 127.0.0.1
          JULGATE_PORT: 8088
          JULGATE_REQUIRE_SECURE_COOKIES: "false"
          JULGATE_DNS_SERVER: 1.1.1.1
          JULGATE_DNS_SEARCH: local
          JULGATE_MAX_REQUEST_BODY_BYTES: 1024
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.yml -f docker-compose-secrets.yaml)
          cleanup() {
            "${compose[@]}" logs --no-color || true
            "${compose[@]}" down --volumes --remove-orphans || true
            rm -rf secrets
          }
          trap cleanup EXIT

          mkdir -p secrets
          printf '%s' 'ci-only-password-with-16-characters' > secrets/julgate_admin_password
          printf '%s' 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' > secrets/julgate_credential_key

          "${compose[@]}" up --detach --build

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8088/healthz >/tmp/julgate-health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            echo "Julgate did not become healthy."
            exit 1
          fi

          curl --fail --silent --show-error --dump-header /tmp/julgate-headers.txt \
            --output /tmp/julgate-login.html http://127.0.0.1:8088/login
          curl --fail --silent --show-error --output /tmp/julgate-manifest.json \
            http://127.0.0.1:8088/manifest.webmanifest
          curl --fail --silent --show-error --output /tmp/guacamole.html \
            http://127.0.0.1:8088/guacamole/
          grep --ignore-case --quiet '^X-Content-Type-Options: nosniff' /tmp/julgate-headers.txt
          grep --quiet 'Julgate' /tmp/julgate-login.html
          grep --quiet 'Julgate' /tmp/julgate-manifest.json
          ! grep --quiet 'Matgate' /tmp/julgate-manifest.json
          "${compose[@]}" exec -T julgate sh -c \
            'test -r /run/secrets/julgate_admin_password && test -r /run/secrets/julgate_credential_key'
          "${compose[@]}" exec -T julgate sh -c \
            'test ! -e /data/user-mapping.xml && test ! -e /data/guacamole/user-mapping.xml'

          website_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/website/test)"
          tools_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/tools)"
          archive_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8088/api/files/00000000-0000-0000-0000-000000000001/extract)"
          traversal_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8088/?path=folder%252f..%252fsecret')"
          csrf_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Origin: https://evil.invalid' http://127.0.0.1:8088/login)"
          payload_status="$(python3 - <<'PY'
          import http.client
          connection = http.client.HTTPConnection('127.0.0.1', 8088)
          connection.request('POST', '/login', body='x' * 2048, headers={'Content-Type': 'application/octet-stream'})
          print(connection.getresponse().status)
          connection.close()
          PY
          )"
          test "$website_status" = "404"
          test "$tools_status" = "404"
          test "$archive_status" = "404"
          test "$traversal_status" = "400"
          test "$csrf_status" = "403"
          test "$payload_status" = "413"

          login_status=""
          for attempt in {1..11}; do
            login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST http://127.0.0.1:8088/login)"
          done
          test "$login_status" = "429"

          mkdir -p artifacts/ui
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --screenshot="$PWD/artifacts/ui/julgate-login.png" \
            http://127.0.0.1:8088/login
          test -s artifacts/ui/julgate-login.png

      - name: Upload UI smoke screenshot
        uses: actions/upload-artifact@v7
        with:
          name: julgate-ui-smoke
          path: artifacts/ui/julgate-login.png
          if-no-files-found: error
          retention-days: 14

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' Matgate/Matgate.csproj | head -n 1)"
          if [[ -z "$base_version" ]]; then
            echo "VersionPrefix is missing."
            exit 1
          fi

          if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VersionPrefix must be a stable semantic version such as 1.2.3."
            exit 1
          fi

          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          publish=false
          channel=ci

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$base_version" ]]; then
              echo "Tag v$version does not match VersionPrefix $base_version."
              exit 1
            fi
            publish=true
            channel=release
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            version="${base_version}-edge.${GITHUB_RUN_NUMBER}"
            publish=true
            channel=edge
          else
            version="${base_version}-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.base_version }},enable=${{ steps.version.outputs.channel == 'release' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.channel == 'release' }}
            type=raw,value=edge,enable=${{ steps.version.outputs.channel == 'edge' }}
            type=sha,prefix=sha-

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Matgate/Dockerfile
          build-args: |
            JULGATE_VERSION=${{ steps.version.outputs.version }}
            JULGATE_BUILD_TAG=github
            JULGATE_BUILD_TIME=${{ steps.version.outputs.build_time }}
          push: ${{ steps.version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
