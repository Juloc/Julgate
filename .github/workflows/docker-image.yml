name: Julgate build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: julgate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Julgate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose files
        env:
          JULGATE_ADMIN_PASSWORD: ci-only-password-with-16-characters
          JULGATE_CREDENTIAL_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JULGATE_GUACAMOLE_JSON_SECRET_KEY: fedcba98765432100123456789abcdef
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose-simple.yaml config >/dev/null
          docker compose -f docker-compose-dockhand.yaml config >/dev/null

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Matgate.slnx

      - name: Build
        run: dotnet build Matgate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Matgate.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Start hardened stack and smoke test
        env:
          JULGATE_ADMIN_PASSWORD: ci-only-password-with-16-characters
          JULGATE_CREDENTIAL_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JULGATE_GUACAMOLE_JSON_SECRET_KEY: fedcba98765432100123456789abcdef
          JULGATE_BIND_ADDRESS: 127.0.0.1
          JULGATE_PORT: 8088
          JULGATE_REQUIRE_SECURE_COOKIES: "false"
          JULGATE_DNS_SERVER: 1.1.1.1
          JULGATE_DNS_SEARCH: local
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up --detach --build

          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:8088/healthz >/tmp/julgate-health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            echo "Julgate did not become healthy."
            exit 1
          fi

          curl --fail --silent --show-error --dump-header /tmp/julgate-headers.txt \
            --output /tmp/julgate-login.html http://127.0.0.1:8088/login
          curl --fail --silent --show-error --output /tmp/guacamole.html \
            http://127.0.0.1:8088/guacamole/
          grep --ignore-case --quiet '^X-Content-Type-Options: nosniff' /tmp/julgate-headers.txt
          grep --quiet 'Julgate' /tmp/julgate-login.html
          docker compose exec -T julgate sh -c \
            'test ! -e /data/user-mapping.xml && test ! -e /data/guacamole/user-mapping.xml'

          website_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/website/test)"
          tools_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/tools)"
          traversal_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8088/?path=folder%252f..%252fsecret')"
          csrf_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Origin: https://evil.invalid' http://127.0.0.1:8088/login)"
          test "$website_status" = "404"
          test "$tools_status" = "404"
          test "$traversal_status" = "400"
          test "$csrf_status" = "403"

          login_status=""
          for attempt in {1..11}; do
            login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST http://127.0.0.1:8088/login)"
          done
          test "$login_status" = "429"

          mkdir -p artifacts/ui
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --screenshot="$PWD/artifacts/ui/julgate-login.png" \
            http://127.0.0.1:8088/login
          test -s artifacts/ui/julgate-login.png

      - name: Upload UI smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: julgate-ui-smoke
          path: artifacts/ui/julgate-login.png
          if-no-files-found: error
          retention-days: 14

      - name: Compute version
        id: version
        shell: bash
        run: |
          base_version="$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' Matgate/Matgate.csproj | head -n 1)"
          if [[ -z "$base_version" ]]; then
            base_version="0.1.0"
          fi

          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base_version}-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Matgate/Dockerfile
          build-args: |
            JULGATE_VERSION=${{ steps.version.outputs.version }}
            JULGATE_BUILD_TAG=github
            JULGATE_BUILD_TIME=${{ steps.version.outputs.build_time }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
