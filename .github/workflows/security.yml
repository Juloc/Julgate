name: Julgate security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet restore Matgate.slnx
          dotnet build Matgate.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  nuget-audit:
    name: NuGet vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore with vulnerability gate
        run: dotnet restore Matgate.slnx

      - name: Report vulnerable packages
        run: dotnet package list --project Matgate.slnx --vulnerable --include-transitive --no-restore
