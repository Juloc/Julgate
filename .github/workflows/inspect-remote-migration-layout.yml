# Temporary branch-only inspection. Removed before review.

name: Inspect Remote Migration Layout

on:
  pull_request:
    paths:
      - .github/workflows/inspect-remote-migration-layout.yml

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Probe repository token package restore
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/repository-token-package-probe"
          feed="https://nuget.pkg.github.com/Juloc/index.json"
          dotnet nuget add source \
            --username Juloc \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --valid-authentication-types basic \
            --name github \
            "$feed"
          dotnet new classlib --name RepositoryTokenPackageProbe --framework net10.0 --output "$probe"
          dotnet add "$probe/RepositoryTokenPackageProbe.csproj" package JulOS.Remote.Transport \
            --version 0.1.0 \
            --source "$feed"
          dotnet restore "$probe/RepositoryTokenPackageProbe.csproj" --source "$feed"
