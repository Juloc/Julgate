# Temporary branch-only inspection. Removed before review.

name: Inspect Remote Migration Layout

on:
  pull_request:
    paths:
      - .github/workflows/inspect-remote-migration-layout.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Probe anonymous package restore
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/anonymous-package-probe"
          feed="https://nuget.pkg.github.com/Juloc/index.json"
          dotnet new classlib --name AnonymousPackageProbe --framework net10.0 --output "$probe"
          dotnet add "$probe/AnonymousPackageProbe.csproj" package JulOS.Remote.Transport \
            --version 0.1.0 \
            --source "$feed"
          dotnet restore "$probe/AnonymousPackageProbe.csproj" --source "$feed"
