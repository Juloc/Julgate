# Temporary branch-only migration workflow. It removes itself in the generated commit.

name: Apply Remote Transport Migration

on:
  pull_request:
    paths:
      - .github/workflows/apply-remote-transport-migration.yml

permissions:
  contents: write

concurrency:
  group: apply-remote-transport-migration
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Juloc/Julgate' && github.head_ref == 'agent/use-julos-remote-transport-0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/use-julos-remote-transport-0.1.0
          persist-credentials: true

      - name: Apply the complete migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          token_expr = "$" + "{{ github.token }}"

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8-sig")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement anchor, found {count}")
              target.write_text(content.replace(old, new), encoding="utf-8", newline="\n")

          write("NuGet.config", """<?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="github" value="https://nuget.pkg.github.com/Juloc/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="github">
                <package pattern="JulOS.Remote.Transport" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          """.replace("          ", ""))

          replace_once(
              "Matgate/Matgate.csproj",
              "  <ItemGroup>\n    <PackageReference Include=\"FluentFTP\" Version=\"54.1.2\" />",
              "  <ItemGroup>\n    <PackageReference Include=\"JulOS.Remote.Transport\" Version=\"0.1.0\" />\n    <PackageReference Include=\"FluentFTP\" Version=\"54.1.2\" />")

          replace_once(
              "Matgate/Program.cs",
              "using System.Text;\nusing Matgate.Services;",
              "using System.Text;\nusing JulOS.Remote.Transport;\nusing Matgate.Services;")
          replace_once(
              "Matgate/Program.cs",
              "builder.Services.AddSingleton<GuacamoleConfigWriter>();\nbuilder.Services.AddSingleton<HtmlViews>();",
              "builder.Services.AddSingleton<GuacamoleConfigWriter>();\nbuilder.Services.AddSingleton<GuacamoleJsonLaunchEncoder>();\nbuilder.Services.AddSingleton<HtmlViews>();")

          write("Matgate/Services/GuacamoleLauncher.cs", r'''using System.Security.Cryptography;
          using System.Text;
          using JulOS.Remote.Transport;
          using Matgate.Models;

          namespace Matgate.Services;

          public sealed class GuacamoleLauncher
          {
              private readonly IConfiguration _configuration;
              private readonly GuacamoleJsonLaunchEncoder _encoder;

              public GuacamoleLauncher(
                  IConfiguration configuration,
                  GuacamoleJsonLaunchEncoder encoder)
              {
                  _configuration = configuration;
                  _encoder = encoder;
              }

              public Task<GuacamoleLaunchResult> CreateLaunchAsync(
                  MatgateUser user,
                  ServerEndpoint server,
                  CancellationToken cancellationToken = default)
              {
                  cancellationToken.ThrowIfCancellationRequested();

                  if (ServerEndpoint.IsWebsiteProtocol(server.Protocol))
                  {
                      return Task.FromResult(GuacamoleLaunchResult.Failed(
                          "Websites are opened directly in Matgate."));
                  }

                  if (!ServerEndpoint.IsGuacamoleProtocol(server.Protocol))
                  {
                      return Task.FromResult(GuacamoleLaunchResult.Failed(
                          "Dateiverbindungen werden im Matgate-Dateimanager gestartet."));
                  }

                  var secret = _configuration["Guacamole:JsonSecretKey"]
                      ?? Environment.GetEnvironmentVariable("GUACAMOLE_JSON_SECRET_KEY")
                      ?? Environment.GetEnvironmentVariable("JSON_SECRET_KEY");

                  if (!TryReadHexKey(secret, out var key))
                  {
                      return Task.FromResult(GuacamoleLaunchResult.Failed(
                          "Guacamole JSON auth secret is missing or invalid. Set Guacamole:JsonSecretKey / GUACAMOLE_JSON_SECRET_KEY to 32 hex characters."));
                  }

                  byte[] passwordBytes = [];
                  try
                  {
                      if (!string.IsNullOrWhiteSpace(server.Password))
                      {
                          passwordBytes = Encoding.UTF8.GetBytes(server.Password);
                      }

                      var connectionName = GuacamoleConfigWriter.ConnectionName(server);
                      var sessionId = $"{server.Id:N}-{Guid.NewGuid():N}";
                      var ttlMinutes = Math.Clamp(
                          _configuration.GetValue("Guacamole:LaunchTtlMinutes", 2),
                          1,
                          30);
                      var protocol = GuacamoleConfigWriter.ProtocolName(server.Protocol);
                      var isDesktop = server.Protocol == ServerProtocol.Rdp;
                      var request = new GuacamoleLaunchRequest(
                          CallerName: user.UserName,
                          ConnectionName: connectionName,
                          SessionId: sessionId,
                          Protocol: protocol,
                          Host: server.Host,
                          Port: server.Port,
                          UserName: server.UserName,
                          PasswordUtf8: passwordBytes,
                          Domain: server.Domain,
                          IgnoreCertificate: server.IgnoreCertificate,
                          KeyboardLayout: server.KeyboardLayout,
                          TerminalFontSize: server.TerminalFontSize,
                          EnableDrive: isDesktop,
                          DriveName: isDesktop ? "Matgate" : null,
                          DrivePath: isDesktop ? $"/drive/{server.Id:N}" : null,
                          ClientName: isDesktop ? "Matgate" : null,
                          ExpiresAtUtc: DateTimeOffset.UtcNow.AddMinutes(ttlMinutes));
                      var token = _encoder.Encode(request, key);
                      var publicBasePath = _configuration["Guacamole:PublicBasePath"] ?? "/guacamole";
                      var directLaunch = _configuration.GetValue("Guacamole:DirectLaunch", true);
                      var url = directLaunch
                          ? $"{publicBasePath.TrimEnd('/')}/#/client/{Uri.EscapeDataString(token.ClientIdentifier)}?data={Uri.EscapeDataString(token.EncryptedData)}"
                          : $"{publicBasePath.TrimEnd('/')}/#/?data={Uri.EscapeDataString(token.EncryptedData)}";

                      return Task.FromResult(GuacamoleLaunchResult.Ok(
                          url,
                          token.EncryptedData,
                          token.ConnectionName));
                  }
                  catch (ArgumentException)
                  {
                      return Task.FromResult(GuacamoleLaunchResult.Failed(
                          "The remote connection settings are invalid."));
                  }
                  finally
                  {
                      CryptographicOperations.ZeroMemory(key);
                      CryptographicOperations.ZeroMemory(passwordBytes);
                  }
              }

              private static bool TryReadHexKey(string? value, out byte[] key)
              {
                  key = [];
                  if (string.IsNullOrWhiteSpace(value) || value.Length != 32)
                  {
                      return false;
                  }

                  try
                  {
                      key = Convert.FromHexString(value);
                      return key.Length == 16;
                  }
                  catch (FormatException)
                  {
                      return false;
                  }
              }
          }

          public sealed record GuacamoleLaunchResult(
              bool Success,
              string? Url,
              string? Error,
              string? EncryptedData,
              string? ConnectionName)
          {
              public static GuacamoleLaunchResult Ok(string url, string encryptedData, string connectionName)
              {
                  return new(true, url, null, encryptedData, connectionName);
              }

              public static GuacamoleLaunchResult Failed(string error) => new(false, null, error, null, null);
          }
          '''.replace("          ", ""))

          write("Matgate.Tests/GuacamoleLauncherTests.cs", r'''using System.Security.Cryptography;
          using System.Text.Json;
          using JulOS.Remote.Transport;
          using Matgate.Models;
          using Matgate.Services;
          using Microsoft.Extensions.Configuration;
          using Xunit;

          namespace Matgate.Tests;

          public sealed class GuacamoleLauncherTests
          {
              private const string JsonKeyHex = "00112233445566778899aabbccddeeff";

              [Fact]
              public async Task DesktopLaunchUsesSharedEncoderAndPreservesJulgateOptions()
              {
                  var serverId = Guid.Parse("11111111-1111-4111-8111-111111111111");
                  var launcher = CreateLauncher();
                  var result = await launcher.CreateLaunchAsync(
                      new MatgateUser { UserName = "operator" },
                      new ServerEndpoint
                      {
                          Id = serverId,
                          Name = "Desktop",
                          Protocol = ServerProtocol.Rdp,
                          Host = "host.example.test",
                          Port = 3389,
                          UserName = "remote-user",
                          Password = "remote-password",
                          Domain = "EXAMPLE",
                          KeyboardLayout = "de-de-qwertz",
                          IgnoreCertificate = true
                      });

                  Assert.True(result.Success);
                  Assert.Null(result.Error);
                  Assert.NotNull(result.Url);
                  Assert.StartsWith("/guacamole/#/client/", result.Url, StringComparison.Ordinal);
                  Assert.NotNull(result.EncryptedData);
                  Assert.Equal("Desktop", result.ConnectionName);

                  using var document = DecryptAndVerify(result.EncryptedData!);
                  var root = document.RootElement;
                  Assert.Equal("operator", root.GetProperty("username").GetString());
                  var connection = root.GetProperty("connections").GetProperty("Desktop");
                  Assert.Equal(RemoteTransportProtocols.Rdp, connection.GetProperty("protocol").GetString());
                  var parameters = connection.GetProperty("parameters");
                  Assert.Equal("host.example.test", parameters.GetProperty("hostname").GetString());
                  Assert.Equal("3389", parameters.GetProperty("port").GetString());
                  Assert.Equal("remote-user", parameters.GetProperty("username").GetString());
                  Assert.Equal("remote-password", parameters.GetProperty("password").GetString());
                  Assert.Equal("EXAMPLE", parameters.GetProperty("domain").GetString());
                  Assert.Equal("true", parameters.GetProperty("ignore-cert").GetString());
                  Assert.Equal("Matgate", parameters.GetProperty("client-name").GetString());
                  Assert.Equal("true", parameters.GetProperty("enable-drive").GetString());
                  Assert.Equal("Matgate", parameters.GetProperty("drive-name").GetString());
                  Assert.Equal($"/drive/{serverId:N}", parameters.GetProperty("drive-path").GetString());
              }

              [Fact]
              public async Task VncLaunchOmitsDesktopAndUserParameters()
              {
                  var result = await CreateLauncher().CreateLaunchAsync(
                      new MatgateUser { UserName = "operator" },
                      new ServerEndpoint
                      {
                          Name = "Console",
                          Protocol = ServerProtocol.Vnc,
                          Host = "console.example.test",
                          Port = 5900,
                          UserName = "ignored-user",
                          Password = "vnc-password"
                      });

                  Assert.True(result.Success);
                  using var document = DecryptAndVerify(result.EncryptedData!);
                  var parameters = document.RootElement
                      .GetProperty("connections")
                      .GetProperty("Console")
                      .GetProperty("parameters");
                  Assert.False(parameters.TryGetProperty("username", out _));
                  Assert.False(parameters.TryGetProperty("domain", out _));
                  Assert.False(parameters.TryGetProperty("enable-drive", out _));
                  Assert.Equal("vnc-password", parameters.GetProperty("password").GetString());
              }

              [Fact]
              public async Task InvalidSecretAndNonRemoteProtocolsFailWithoutLaunchData()
              {
                  var invalidConfiguration = new ConfigurationManager();
                  invalidConfiguration["Guacamole:JsonSecretKey"] = "invalid";
                  var invalidLauncher = new GuacamoleLauncher(
                      invalidConfiguration,
                      new GuacamoleJsonLaunchEncoder());
                  var invalidSecret = await invalidLauncher.CreateLaunchAsync(
                      new MatgateUser { UserName = "operator" },
                      new ServerEndpoint
                      {
                          Name = "Desktop",
                          Protocol = ServerProtocol.Rdp,
                          Host = "host.example.test",
                          Port = 3389
                      });
                  var website = await CreateLauncher().CreateLaunchAsync(
                      new MatgateUser { UserName = "operator" },
                      new ServerEndpoint
                      {
                          Name = "Website",
                          Protocol = ServerProtocol.Website,
                          WebsiteUrl = "https://example.test"
                      });

                  Assert.False(invalidSecret.Success);
                  Assert.Null(invalidSecret.EncryptedData);
                  Assert.False(website.Success);
                  Assert.Null(website.EncryptedData);
              }

              [Fact]
              public void EncoderComesFromThePublishedSharedAssembly()
              {
                  Assert.Equal(
                      "JulOS.Remote.Transport",
                      typeof(GuacamoleJsonLaunchEncoder).Assembly.GetName().Name);
              }

              private static GuacamoleLauncher CreateLauncher()
              {
                  var configuration = new ConfigurationManager();
                  configuration["Guacamole:JsonSecretKey"] = JsonKeyHex;
                  configuration["Guacamole:PublicBasePath"] = "/guacamole";
                  configuration["Guacamole:DirectLaunch"] = "true";
                  configuration["Guacamole:LaunchTtlMinutes"] = "2";
                  return new GuacamoleLauncher(
                      configuration,
                      new GuacamoleJsonLaunchEncoder());
              }

              private static JsonDocument DecryptAndVerify(string encryptedData)
              {
                  var key = Convert.FromHexString(JsonKeyHex);
                  var encrypted = Convert.FromBase64String(encryptedData);
                  Span<byte> initializationVector = stackalloc byte[16];
                  byte[] decrypted;

                  try
                  {
                      using var aes = Aes.Create();
                      aes.Key = key;
          #pragma warning disable CA5358 // This verifies the Guacamole-required JSON-auth format.
                      decrypted = aes.DecryptCbc(
                          encrypted,
                          initializationVector,
                          PaddingMode.PKCS7);
          #pragma warning restore CA5358
                  }
                  finally
                  {
                      CryptographicOperations.ZeroMemory(key);
                      CryptographicOperations.ZeroMemory(encrypted);
                  }

                  try
                  {
                      var signature = decrypted.AsSpan(0, 32);
                      var payload = decrypted.AsSpan(32);
                      var verificationKey = Convert.FromHexString(JsonKeyHex);
                      var expected = HMACSHA256.HashData(verificationKey, payload);
                      try
                      {
                          Assert.True(CryptographicOperations.FixedTimeEquals(signature, expected));
                          return JsonDocument.Parse(payload);
                      }
                      finally
                      {
                          CryptographicOperations.ZeroMemory(verificationKey);
                          CryptographicOperations.ZeroMemory(expected);
                      }
                  }
                  finally
                  {
                      CryptographicOperations.ZeroMemory(decrypted);
                  }
              }
          }
          '''.replace("          ", ""))

          write("Matgate/Dockerfile", r'''# syntax=docker/dockerfile:1.7
          FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
          WORKDIR /src
          ARG JULGATE_VERSION=
          ARG MATGATE_VERSION=

          COPY NuGet.config ./
          COPY Matgate/Matgate.csproj Matgate/
          RUN --mount=type=secret,id=github_token,required=true \
              token="$(cat /run/secrets/github_token)"; \
              export NuGetPackageSourceCredentials_github="Username=Juloc;Password=${token};ValidAuthenticationTypes=Basic"; \
              dotnet restore Matgate/Matgate.csproj --configfile /src/NuGet.config

          COPY Matgate/ Matgate/
          RUN version="${JULGATE_VERSION:-$MATGATE_VERSION}"; \
              if [ -n "$version" ]; then \
                dotnet publish Matgate/Matgate.csproj -c Release -o /app/publish --no-restore /p:UseAppHost=false /p:Version="$version" /p:InformationalVersion="$version"; \
              else \
                dotnet publish Matgate/Matgate.csproj -c Release -o /app/publish --no-restore /p:UseAppHost=false; \
              fi

          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          WORKDIR /app

          ARG JULGATE_BUILD_TAG=local
          ARG JULGATE_BUILD_TIME=
          ARG MATGATE_BUILD_TAG=
          ARG MATGATE_BUILD_TIME=
          ENV ASPNETCORE_URLS=http://+:8080
          ENV JULGATE_DATA_DIR=/data
          ENV MATGATE_DATA_DIR=/data
          ENV JULGATE_BUILD_TAG=${JULGATE_BUILD_TAG}
          ENV MATGATE_BUILD_TAG=${MATGATE_BUILD_TAG}

          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/* \
              && mkdir -p /data \
              && chown -R "$APP_UID":0 /data /app \
              && chmod 0700 /data

          EXPOSE 8080

          COPY --from=build --chown=$APP_UID:0 /app/publish .
          RUN set -eu; \
              build_time="${JULGATE_BUILD_TIME:-${MATGATE_BUILD_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}}"; \
              printf '%s\n' "$build_time" > /app/matgate-build-time.txt; \
              chown "$APP_UID":0 /app/matgate-build-time.txt

          USER $APP_UID

          HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
              CMD curl --fail --silent --show-error http://127.0.0.1:8080/healthz || exit 1

          ENTRYPOINT ["dotnet", "Matgate.dll"]
          '''.replace("          ", ""))

          replace_once(
              "docker-compose.yml",
              "      dockerfile: Matgate/Dockerfile\n      args:",
              "      dockerfile: Matgate/Dockerfile\n      secrets:\n        - github_token\n      args:")
          replace_once(
              "docker-compose.yml",
              "volumes:\n  data:",
              "secrets:\n  github_token:\n    environment: JULGATE_GITHUB_PACKAGES_TOKEN\n\nvolumes:\n  data:")

          credential_env = (
              "NuGetPackageSourceCredentials_github: "
              f"Username=Juloc;Password={token_expr};ValidAuthenticationTypes=Basic")

          replace_once(
              ".github/workflows/docker-image.yml",
              "  IMAGE_NAME: ${{ github.repository }}",
              "  IMAGE_NAME: ${{ github.repository }}\n  " + credential_env)
          replace_once(
              ".github/workflows/docker-image.yml",
              "          JULGATE_GUACAMOLE_JSON_SECRET_KEY: fedcba98765432100123456789abcdef\n        shell: bash",
              "          JULGATE_GUACAMOLE_JSON_SECRET_KEY: fedcba98765432100123456789abcdef\n          JULGATE_GITHUB_PACKAGES_TOKEN: " + token_expr + "\n        shell: bash")
          replace_once(
              ".github/workflows/docker-image.yml",
              "          JULGATE_MAX_REQUEST_BODY_BYTES: 1024\n        shell: bash",
              "          JULGATE_MAX_REQUEST_BODY_BYTES: 1024\n          JULGATE_GITHUB_PACKAGES_TOKEN: " + token_expr + "\n        shell: bash")
          replace_once(
              ".github/workflows/docker-image.yml",
              "          sbom: true",
              "          sbom: true\n          secrets: |\n            github_token=" + token_expr)

          replace_once(
              ".github/workflows/security.yml",
              "permissions:\n  contents: read\n\njobs:",
              "permissions:\n  contents: read\n  packages: read\n\nenv:\n  " + credential_env + "\n\njobs:")

          replace_once(
              ".github/workflows/completion-validation.yml",
              "permissions:\n  contents: read\n\nconcurrency:",
              "permissions:\n  contents: read\n  packages: read\n\nenv:\n  " + credential_env + "\n\nconcurrency:")
          replace_once(
              ".github/workflows/completion-validation.yml",
              "      JULGATE_E2E_ARTIFACTS: artifacts/e2e",
              "      JULGATE_E2E_ARTIFACTS: artifacts/e2e\n      JULGATE_GITHUB_PACKAGES_TOKEN: " + token_expr)
          replace_once(
              ".github/workflows/completion-validation.yml",
              "      - name: Build scan image\n        run: docker build --file Matgate/Dockerfile --tag julgate-completion:${{ github.sha }} .",
              "      - name: Build scan image\n        env:\n          JULGATE_GITHUB_PACKAGES_TOKEN: " + token_expr + "\n        run: docker build --secret id=github_token,env=JULGATE_GITHUB_PACKAGES_TOKEN --file Matgate/Dockerfile --tag julgate-completion:${{ github.sha }} .")

          replace_once(
              ".github/workflows/file-protocol-integration.yml",
              "permissions:\n  contents: read\n\nconcurrency:",
              "permissions:\n  contents: read\n  packages: read\n\nenv:\n  " + credential_env + "\n\nconcurrency:")

          Path(".github/workflows/inspect-remote-migration-layout.yml").unlink()
          Path(".github/workflows/apply-remote-transport-migration.yml").unlink()
          PY

          git diff --check
          test ! -e .github/workflows/inspect-remote-migration-layout.yml
          test ! -e .github/workflows/apply-remote-transport-migration.yml
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(remote): use shared JulOS transport package"
          git push origin HEAD:agent/use-julos-remote-transport-0.1.0
