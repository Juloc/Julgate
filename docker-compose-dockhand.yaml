name: julgate

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  edge:
    <<: *default-security
    image: caddy:2.11.4-alpine
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - julgate
      - guacamole
    ports:
      - "${JULGATE_BIND_ADDRESS:-127.0.0.1}:${JULGATE_PORT:-8088}:8088"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf "%s\n" \
          ":8088 {" \
          "  encode zstd gzip" \
          "  handle /guacamole* {" \
          "    reverse_proxy guacamole:8080" \
          "  }" \
          "  handle {" \
          "    reverse_proxy julgate:8080" \
          "  }" \
          "}" > /tmp/Caddyfile && \
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,nr_inodes=1024
      - /config:rw,noexec,nosuid,nodev,size=16m,nr_inodes=1024
      - /data:rw,noexec,nosuid,nodev,size=16m,nr_inodes=1024
    pids_limit: 128
    mem_limit: 256m
    networks:
      - frontend
      - backend
    restart: unless-stopped

  julgate:
    <<: *default-security
    image: ghcr.io/juloc/julgate:${JULGATE_VERSION:-0.7.0}
    pull_policy: always
    environment:
      ASPNETCORE_URLS: http://+:8080
      JULGATE_DATA_DIR: /data
      MATGATE_DATA_DIR: /data
      JULGATE_ADMIN_USER: ${JULGATE_ADMIN_USER:-admin}
      JULGATE_ADMIN_PASSWORD: ${JULGATE_ADMIN_PASSWORD:-}
      JULGATE_CREDENTIAL_KEY: ${JULGATE_CREDENTIAL_KEY:-}
      JULGATE_CREDENTIAL_KEY_PREVIOUS: ${JULGATE_CREDENTIAL_KEY_PREVIOUS:-}
      JULGATE_GUACAMOLE_JSON_SECRET_KEY: ${JULGATE_GUACAMOLE_JSON_SECRET_KEY:?Set JULGATE_GUACAMOLE_JSON_SECRET_KEY}
      Guacamole__JsonSecretKey: ${JULGATE_GUACAMOLE_JSON_SECRET_KEY:?Set JULGATE_GUACAMOLE_JSON_SECRET_KEY}
      Guacamole__PublicBasePath: /guacamole
      Guacamole__DirectLaunch: "true"
      Guacamole__LaunchTtlMinutes: "1"
      JULGATE_REQUIRE_SECURE_COOKIES: ${JULGATE_REQUIRE_SECURE_COOKIES:-true}
      JULGATE_TRUST_FORWARD_HEADERS: "true"
      JULGATE_SESSION_HOURS: ${JULGATE_SESSION_HOURS:-8}
      JULGATE_MAX_REQUEST_BODY_BYTES: ${JULGATE_MAX_REQUEST_BODY_BYTES:-536870912}
      JULGATE_FILE_OPERATION_TIMEOUT_SECONDS: ${JULGATE_FILE_OPERATION_TIMEOUT_SECONDS:-120}
      JULGATE_MAX_UPLOAD_BYTES: ${JULGATE_MAX_UPLOAD_BYTES:-536870912}
      JULGATE_MAX_DOWNLOAD_BYTES: ${JULGATE_MAX_DOWNLOAD_BYTES:-2147483648}
      JULGATE_MAX_DIRECTORY_ENTRIES: ${JULGATE_MAX_DIRECTORY_ENTRIES:-10000}
      JULGATE_ENABLE_WEBSITE_PROXY: ${JULGATE_ENABLE_WEBSITE_PROXY:-false}
      JULGATE_ENABLE_NETWORK_TOOLS: ${JULGATE_ENABLE_NETWORK_TOOLS:-false}
      JULGATE_ENABLE_ARCHIVE_EXTRACTION: ${JULGATE_ENABLE_ARCHIVE_EXTRACTION:-false}
      JULGATE_MAX_ARCHIVE_EXPANDED_BYTES: ${JULGATE_MAX_ARCHIVE_EXPANDED_BYTES:-268435456}
      JULGATE_MAX_ARCHIVE_ENTRIES: ${JULGATE_MAX_ARCHIVE_ENTRIES:-4096}
      JULGATE_MAX_CONCURRENT_ARCHIVE_EXTRACTIONS: ${JULGATE_MAX_CONCURRENT_ARCHIVE_EXTRACTIONS:-1}
      JULGATE_DNS_SERVER: ${JULGATE_DNS_SERVER:-10.10.0.1}
      JULGATE_DNS_SEARCH: ${JULGATE_DNS_SEARCH:-example.home}
    dns:
      - ${JULGATE_DNS_SERVER:-10.10.0.1}
    dns_search:
      - ${JULGATE_DNS_SEARCH:-example.home}
    volumes:
      - data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=320m,nr_inodes=8192
    pids_limit: 256
    mem_limit: 1g
    networks:
      - backend
      - egress
    restart: unless-stopped

  guacd:
    <<: *default-security
    image: guacamole/guacd:1.6.0
    dns:
      - ${JULGATE_DNS_SERVER:-10.10.0.1}
    dns_search:
      - ${JULGATE_DNS_SEARCH:-example.home}
    volumes:
      - drives:/drive
    pids_limit: 256
    mem_limit: 768m
    networks:
      - backend
      - egress
    restart: unless-stopped

  guacamole:
    <<: *default-security
    image: guacamole/guacamole:1.6.0
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${JULGATE_GUACAMOLE_JSON_SECRET_KEY:?Set JULGATE_GUACAMOLE_JSON_SECRET_KEY}
    pids_limit: 256
    mem_limit: 512m
    networks:
      - backend
    restart: unless-stopped

volumes:
  data:
    name: julgate-data
  drives:
    name: julgate-drives

networks:
  frontend:
  backend:
    internal: true
  egress:
